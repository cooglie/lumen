name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer || true

      - name: Build (SPM)
        run: swift build -c release

      - name: Typecheck
        run: swift build 2>&1 | grep -i error || true
