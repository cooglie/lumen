name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S windows -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $out = "build/Release"
          if (-not (Test-Path "$out/Lumen.exe")) { $out = "build" }
          New-Item -ItemType Directory -Force -Path Lumen-win
          Copy-Item "$out/Lumen.exe" Lumen-win/
          if (Test-Path "$out/shaders") { Copy-Item -Recurse "$out/shaders" Lumen-win/ }
          if (Test-Path "$out/lumen.ico") { Copy-Item "$out/lumen.ico" Lumen-win/ }
          Compress-Archive -Path Lumen-win/* -DestinationPath Lumen-win.zip -Force
          Write-Host "Packaged: Lumen-win.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-win
          path: Lumen-win.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} Lumen-win.zip --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release not found yet — artifact available in workflow run. Upload manually."
          }
